name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Do not cancel secret-scan mid-run when a newer push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if tracked secrets reappear
        run: bash scripts/check_no_secrets.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smartdocs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars-long
      # CI-only Fernet key (test data only, not a real secret).
      FERNET_KEY: hiUVDEzvbCXOLkqiRvrL44PGuUSUjbedaUu20xUsquw=
      DATABASE_URL: postgresql://test:test@localhost:5432/smartdocs_test
      # Same DB for runtime RLS tests — app_runtime role is created by migration 0017.
      DATABASE_URL_RUNTIME: postgresql://app_runtime:smartdocs_runtime_dev@localhost:5432/smartdocs_test
      DATABASE_URL_MIGRATOR: postgresql://app_migrator:smartdocs_migrator_dev@localhost:5432/smartdocs_test
      APP_RUNTIME_PASSWORD: smartdocs_runtime_dev
      APP_MIGRATOR_PASSWORD: smartdocs_migrator_dev
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      DEBUG: "true"
      # CI never talks to Supabase or the campus 10.2.8.x network.
      DB_SSL_NO_VERIFY: "true"
      DB_ENFORCE_RLS: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install system packages for OCR tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr libgl1
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Enable pg_trgm + grant test role
        run: |
          PGPASSWORD=test psql -h localhost -U test -d smartdocs_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          -- migrations create app_runtime / app_migrator; grant test superuser can connect as owner
          SQL
      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Resync users sequence after role bootstrap
        run: |
          PGPASSWORD=test psql -h localhost -U test -d smartdocs_test -c \
            "SELECT setval(pg_get_serial_sequence('users','id'), GREATEST((SELECT COALESCE(MAX(id),1) FROM users),1));"
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Check linting
        run: ruff check backend/ --select E,F,W --ignore E501
      - name: Check formatting (informational)
        run: ruff format --check backend/ || true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (compose context)
        run: docker compose build backend
      - name: Build root Jenkins-style image
        run: docker build -t taxsync-backend:ci .

  frontend-checks:
    runs-on: ubuntu-latest
    # Monorepo keeps a frontend/ tree for local/dev; ship UI also lives in
    # Taxsync_Frontend. Skip cleanly if package.json is absent on a branch.
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend package
        id: fe
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.fe.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.fe.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Type check
        if: steps.fe.outputs.present == 'true'
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        if: steps.fe.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
        env:
          # Browser-facing API origin for campus staging (also used in IIIT nginx path).
          NEXT_PUBLIC_API_URL: https://canvas.iiit.ac.in/taxsyncbestage
