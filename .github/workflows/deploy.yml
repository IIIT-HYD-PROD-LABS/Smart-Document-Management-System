name: Deploy

# Image publish only. Campus runtime (IIIT 10.2.8.73 :8025/:8026, IIIT Postgres)
# is deployed via deploy-prod.sh on the host with server-local .env.prod — not
# from GitHub runners (they cannot reach campus network).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build backend + frontend images
        run: |
          docker compose build backend
          if [ -f frontend/package.json ]; then
            docker compose build frontend
          fi

      - name: Login to Docker Hub
        if: ${{ env.HAS_DOCKER_CREDS == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          HAS_DOCKER_CREDS: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}

      - name: Tag and push backend image
        if: ${{ env.HAS_DOCKER_CREDS == 'true' }}
        env:
          HAS_DOCKER_CREDS: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker tag smart-document-management-system-backend:latest "$DOCKER_USERNAME/smartdocs-backend:latest"
          docker tag smart-document-management-system-backend:latest "$DOCKER_USERNAME/smartdocs-backend:${{ github.sha }}"
          docker push "$DOCKER_USERNAME/smartdocs-backend:latest"
          docker push "$DOCKER_USERNAME/smartdocs-backend:${{ github.sha }}"

      - name: Tag and push frontend image
        if: ${{ env.HAS_DOCKER_CREDS == 'true' }}
        env:
          HAS_DOCKER_CREDS: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ ! -f frontend/package.json ]; then
            echo "No frontend package in this tree; skip frontend image push"
            exit 0
          fi
          docker tag smart-document-management-system-frontend:latest "$DOCKER_USERNAME/smartdocs-frontend:latest"
          docker tag smart-document-management-system-frontend:latest "$DOCKER_USERNAME/smartdocs-frontend:${{ github.sha }}"
          docker push "$DOCKER_USERNAME/smartdocs-frontend:latest"
          docker push "$DOCKER_USERNAME/smartdocs-frontend:${{ github.sha }}"

      - name: Campus deploy reminder
        run: |
          cat <<'EOF'
          GitHub Actions cannot reach the IIIT campus network (10.2.8.x).

          Production/staging on campus:
            host: 10.2.8.73
            backend:  :8025  (nginx → https://canvas.iiit.ac.in/taxsyncbestage)
            frontend: :8026  (nginx → https://canvas.iiit.ac.in/taxsyncfestage)
            Postgres: IIIT host Postgres (DATABASE_URL* in server-local .env.prod)

          On the deploy host:
            cd Smart-Document-Management-System
            test -f .env.prod || cp .env.prod.example .env.prod
            # fill DATABASE_URL* with IIIT Postgres (not Supabase)
            ./deploy-prod.sh

          Taxsync_Backend / Taxsync_Frontend are the split remotes used by
          some campus jobs; monorepo origin is the source of truth for CI.
          EOF
