server {
    listen 8026;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA hosted under taxsyncfestage path
    location /taxsyncfestage/ {
        try_files $uri $uri/ /index.html;
    }

    # Redirect without trailing slash
    location = /taxsyncfesatge {
        return 301 /taxsyncfestage/;
    }

    # Global fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
