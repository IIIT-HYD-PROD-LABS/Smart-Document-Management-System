name: CI

on:
  push:
    branches: [main, staging, feat/**]
  pull_request:
    branches: [main, staging]

concurrency:
  group: be-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret file policy
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [[ "$BRANCH" == "staging" ]]; then
            echo "staging: tracked .env required for campus Jenkins autodeploy."
            test -f .env || { echo "ERROR: missing .env on staging"; exit 1; }
            grep -q '^SECRET_KEY=.' .env || { echo "ERROR: .env missing SECRET_KEY"; exit 1; }
            grep -q '^DATABASE_URL=.' .env || { echo "ERROR: .env missing DATABASE_URL"; exit 1; }
          else
            if git ls-files | grep -E '(^|/)\.env($|\.[^/]*$)' | grep -Ev '\.example$' ; then
              echo "Forbidden tracked secret-like paths (not on staging)"; exit 1
            fi
          fi
          if git ls-files | grep -E 'credentials\.json|id_rsa|\.pem$' ; then
            echo "Forbidden key material paths"; exit 1
          fi
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY' \
              --exclude-dir=.git --exclude-dir=tests --exclude='*.md' --exclude='*.example' \
              --exclude='.env' . ; then
            echo "Possible live secret pattern in source (excluding .env)"; exit 1
          fi
          echo "Secret scan OK"

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smartdocs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars-long
      FERNET_KEY: hiUVDEzvbCXOLkqiRvrL44PGuUSUjbedaUu20xUsquw=
      DATABASE_URL: postgresql://test:test@localhost:5432/smartdocs_test
      DATABASE_URL_RUNTIME: postgresql://app_runtime:smartdocs_runtime_dev@localhost:5432/smartdocs_test
      DATABASE_URL_MIGRATOR: postgresql://app_migrator:smartdocs_migrator_dev@localhost:5432/smartdocs_test
      APP_RUNTIME_PASSWORD: smartdocs_runtime_dev
      APP_MIGRATOR_PASSWORD: smartdocs_migrator_dev
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      DEBUG: "true"
      DB_SSL_NO_VERIFY: "true"
      DB_ENFORCE_RLS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr libgl1
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Enable extensions
        run: PGPASSWORD=test psql -h localhost -U test -d smartdocs_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: python -m pytest tests/ -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check app/ --select E,F,W --ignore E501

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (must include .env on staging)
        run: docker build -t taxsync-backend:ci .
