# Minimal pyproject.toml — exists solely to configure `uv` for Vercel
# Python service deployments. The canonical dependency list remains in
# `requirements.txt` (used by the Docker images and CI).
#
# Why this file is needed:
#   Vercel's Python builder runs `uv lock` against requirements.txt before
#   installing. With `--extra-index-url https://download.pytorch.org/whl/cpu`
#   in requirements.txt, uv defaults to `first-index` resolution — meaning
#   each package is resolved from a single index. Pillow 12.2.0 is on PyPI
#   but not on the PyTorch CPU index, so `uv lock` fails:
#       "Because there is no version of pillow==12.2.0 ... unsatisfiable"
#
#   `index-strategy = "unsafe-best-match"` matches pip's default behavior:
#   try all indexes, pick the best match. The "unsafe" prefix is uv's
#   warning that this opens a dependency-confusion attack surface — but
#   our two indexes (PyPI + pytorch.org) are both trusted, so this is fine.

[project]
name = "smart-docs-backend"
version = "2.0.1"
# Vercel's `vercel-runtime==0.13.0` requires Python >=3.12. uv resolves
# to the LOWEST version that satisfies `requires-python`, so `>=3.11`
# was making Vercel's uv pick 3.11 and then fail to install
# vercel-runtime. Bumped to `>=3.12` so uv picks 3.12.
#
# CI / Docker impact: none. CI uses `pip install -r requirements.txt`
# (not `pip install .`), so it doesn't honor this project's
# `requires-python`. Docker images run pip the same way.
requires-python = ">=3.12"

[tool.uv]
# Vercel uses the `--extra-index-url https://download.pytorch.org/whl/cpu`
# in requirements.txt. uv defaults to `first-index` (one source per
# package); pillow 12.2.0 is on PyPI but not on PyTorch's index, so uv
# fails to resolve it. `unsafe-best-match` matches pip's behavior of
# trying every index — both are trusted, no dependency-confusion risk.
index-strategy = "unsafe-best-match"

[tool.pytest.ini_options]
# Phase 15 — async MCP tool tests use FastMCP's Client(server_instance)
# in-memory transport. asyncio_mode="auto" lets pytest-asyncio pick up
# `async def test_*` functions without per-test @pytest.mark.asyncio.
asyncio_mode = "auto"
testpaths = ["tests"]
